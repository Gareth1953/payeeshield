name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p public
          if [ -f index.html ]; then
            cp index.html public/index.html
          else
            echo '<!DOCTYPE html><html><body><h1>PayeeShield LIVE</h1><p>Build ok</p></body></html>' > public/index.html
          fi
          ls -la public
          cat public/index.html
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
