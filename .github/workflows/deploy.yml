name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p public
          cp index.html public/ 2>/dev/null || true
          cp thanks.html public/ 2>/dev/null || true
          cp -r agent-trust-gate public/ 2>/dev/null || true
          ls -la public
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:./public
          publish_branch: gh-pages
          force_orphan: true
